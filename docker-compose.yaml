services:
  api:
    container_name: "api"
    build: ./api
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=postgres
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=postgres
      - DB_PORT=5432
      - CORS_ORIGIN=http://localhost:8081
    depends_on:
      postgres:
        condition: service_healthy

  client:
    container_name: "client"
    build: ./client
    ports:
      - "8081:80"
      - "443:443"
    depends_on:
      - api

  postgres:
    container_name: "postgres"
    image: postgres:18
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
      - PGDATA=/var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
